services:
  localstack:
    image: localstack/localstack:latest
    container_name: vibe-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,apigateway,secretsmanager,dynamodb,logs,iam,sts
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./.localstack/data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
